name: Validate El Mundo de Nico Website

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Build website
        run: npm run build
      - name: Verify production routing and artwork
        shell: bash
        run: |
          test -f dist/index.html
          test -f dist/staticwebapp.config.json
          test -f dist/sitemap.xml
          test -f dist/art/nico-gamer.webp
          test -f dist/art/el-suspiro.webp
