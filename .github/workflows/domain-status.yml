name: Mundo de Nico Domain Status

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AZURE_RESOURCE_GROUP: rg-mundodenico-web-prod
  AZURE_STATIC_WEB_APP_NAME: swa-mundodenico-prod
  DOMAIN: mundodenico.com

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - name: Azure login using GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Show Static Web App and hostname status
        shell: bash
        run: |
          HOST=$(az staticwebapp show --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_STATIC_WEB_APP_NAME" --query defaultHostname -o tsv)
          echo "Azure hostname: https://$HOST"
          echo "Custom domain: https://$DOMAIN"
          az staticwebapp hostname list --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_STATIC_WEB_APP_NAME" -o table || true
