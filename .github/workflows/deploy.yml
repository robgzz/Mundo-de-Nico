name: Deploy El Mundo de Nico V1.0.0

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: mundodenico-website-production
  cancel-in-progress: false

env:
  AZURE_RESOURCE_GROUP: rg-mundodenico-web-prod
  AZURE_LOCATION: centralus
  AZURE_STATIC_WEB_APP_NAME: swa-mundodenico-prod
  AZURE_STATIC_WEB_APP_SKU: Free

jobs:
  build-infra-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Build website
        run: npm run build

      - name: Verify required production assets
        shell: bash
        run: |
          test -f dist/index.html
          test -f dist/staticwebapp.config.json
          test -f dist/sitemap.xml
          test -f dist/art/nico-gamer.webp
          test -f dist/art/el-suspiro.webp

      - name: Azure login using GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify production resource group
        shell: bash
        run: |
          az group show --name "$AZURE_RESOURCE_GROUP" --query name --output tsv >/dev/null

      - name: Validate Bicep
        shell: bash
        run: |
          az bicep version >/dev/null 2>&1 || az bicep install --only-show-errors
          az bicep build --file infra/main.bicep --stdout >/dev/null

      - name: Reconcile Azure infrastructure
        id: infrastructure
        shell: bash
        run: |
          DEPLOYMENT_NAME="mundodenico-web-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RESULT=$(az deployment group create \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$DEPLOYMENT_NAME" \
            --template-file infra/main.bicep \
            --parameters staticWebAppName="$AZURE_STATIC_WEB_APP_NAME" location="$AZURE_LOCATION" skuName="$AZURE_STATIC_WEB_APP_SKU" \
            --output json)
          SWA_NAME=$(echo "$RESULT" | jq -r '.properties.outputs.staticWebAppName.value')
          if [ -z "$SWA_NAME" ] || [ "$SWA_NAME" = "null" ]; then
            echo "Static Web App name was not returned by Bicep." >&2
            exit 1
          fi
          echo "swa_name=$SWA_NAME" >> "$GITHUB_OUTPUT"

      - name: Get short-lived Static Web Apps deployment credential
        id: swa_token
        shell: bash
        run: |
          TOKEN=$(az staticwebapp secrets list \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "${{ steps.infrastructure.outputs.swa_name }}" \
            --query properties.apiKey \
            --output tsv)
          test -n "$TOKEN" || (echo "Azure did not return a Static Web Apps deployment token." >&2; exit 1)
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Deploy pre-built site to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa_token.outputs.token }}
          action: upload
          app_location: dist
          output_location: ''
          skip_app_build: true
          skip_api_build: true

      - name: Smoke test Azure hostname
        shell: bash
        run: |
          HOST=$(az staticwebapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "${{ steps.infrastructure.outputs.swa_name }}" \
            --query defaultHostname --output tsv)
          test -n "$HOST"
          echo "Azure hostname: https://$HOST"
          OK=false
          for i in {1..12}; do
            if curl --fail --silent --show-error --location --max-time 20 "https://$HOST/" >/dev/null; then OK=true; break; fi
            sleep 10
          done
          [ "$OK" = "true" ] || (echo "Smoke test failed: https://$HOST/" >&2; exit 1)

      - name: Deployment summary
        shell: bash
        run: |
          HOST=$(az staticwebapp show --resource-group "$AZURE_RESOURCE_GROUP" --name "${{ steps.infrastructure.outputs.swa_name }}" --query defaultHostname --output tsv)
          {
            echo "## El Mundo de Nico production deployment"
            echo ""
            echo "- Release: V1.0.0"
            echo "- Azure resource group: \`$AZURE_RESOURCE_GROUP\`"
            echo "- Static Web App: \`${{ steps.infrastructure.outputs.swa_name }}\`"
            echo "- Azure URL: https://$HOST"
            echo "- Production URL after custom-domain cutover: https://mundodenico.com"
            echo "- Commit: \`${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"
